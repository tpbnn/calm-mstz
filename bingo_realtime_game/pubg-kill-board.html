<section class="hero"><div><div class="hero-title"><img class="hero-logo" src="./icons/calm_logo.png" alt="로고"><h1>배그 킬내기</h1></div><p>라운드별로 각 참가자의 킬을 기록하고 누적 점수를 자동 계산합니다.<br>각 셀은 숫자 직접 입력과 ± 버튼을 모두 지원하며, 팀별/전체 누적 현황을 방송용 새 창으로 띄울 수 있습니다.</p></div></section>
<div class="room-bar"><div class="room-bar-title">함께 편집</div><input id="roomId" class="room-code-input" placeholder="방 코드" maxlength="24"><button id="newRoomBtn" class="btn-primary">새 방 만들기</button><button id="joinRoomBtn" class="btn-primary">참여</button><span class="presence">접속 <b id="participantCount">0</b>명</span><button id="copyLinkBtn" class="btn-light">링크 복사</button><button id="resetRoomBtn" class="btn-light">방 초기화</button><div id="roomStatus" class="room-status">로컬 편집 중</div></div>
<main class="workspace">
<section class="box broadcast-box"><div class="panel-head"><div><h2>전체 팀 현황</h2><p class="sub">현재 누적 결과 요약 · 방송용 현황판과 동일한 데이터</p></div><div id="teamPopupButtons" class="overview-popup-buttons"></div></div><div class="broadcast-stage"><div id="boardTitle" class="score-title">배그 킬내기</div><div id="teamGrid" class="team-grid"></div></div></section>
<aside class="editor">
<section class="section"><div class="settings-strip"><div><label class="label">제목</label><input id="titleInput" value="배그 킬내기" maxlength="30" style="width:100%"></div><div><label class="label">킬 1개 점수</label><input id="killPoint" type="number" value="1" style="width:100%"></div><div><label class="label">치킨 1회 점수</label><input id="chickenPoint" type="number" value="0" style="width:100%"></div><button id="addTeam" class="btn-success">+ 팀 추가</button></div></section>
<section class="section"><div class="section-title-row"><div><h3>라운드 기록판</h3><p class="sub">스프레드시트처럼 팀별 표에 라운드 기록을 입력합니다. 잠금 체크 시 해당 라운드는 수정할 수 없습니다.</p></div></div><div id="teamEditors" class="teams-sheet"></div></section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getDatabase,ref,set,onValue,get,onDisconnect} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import {firebaseConfig} from "./firebase-config.js";
const db=getDatabase(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const COLORS=[['파랑','#2563eb'],['빨강','#ef4444'],['초록','#16a34a'],['주황','#f97316'],['보라','#8b5cf6'],['분홍','#ec4899'],['청록','#14b8a6'],['노랑','#eab308']];
let roomId='',state=null,unsub=null,presenceRef=null,presenceUnsub=null,localMode=true;
const uid=sessionStorage.getItem('pubgKillUid')||('u_'+Math.random().toString(36).slice(2,10));sessionStorage.setItem('pubgKillUid',uid);
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m));
const rid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const makePlayer=(name='참가자')=>({id:rid('p'),name});
const DEFAULT_ROUNDS=30;
const makeRound=(players=[])=>({id:rid('r'),kills:Object.fromEntries(players.map(p=>[p.id,0])),chicken:0,bonus:0,locked:false});
const makeRounds=(players=[],count=DEFAULT_ROUNDS)=>Array.from({length:count},()=>makeRound(players));
const makeTeam=(i=0)=>{const players=[1,2,3,4].map(n=>makePlayer(`참가자 ${n}`));return{id:rid('t'),name:`${String.fromCharCode(65+i)}팀`,color:COLORS[i%COLORS.length][1],players,rounds:makeRounds(players)}};
function emptyState(){return{settings:{title:'배그 킬내기',killPoint:1,chickenPoint:0,defaultRoundsV6:true},teams:[makeTeam(0),makeTeam(1),makeTeam(2),makeTeam(3)]}}
function normalize(){state=state||emptyState();state.settings=Object.assign({title:'배그 킬내기',killPoint:1,chickenPoint:0,defaultRoundsV6:false},state.settings||{});state.teams=Array.isArray(state.teams)?state.teams:[];state.teams.forEach((t,i)=>{t.id=t.id||rid('t');t.name=t.name||`${i+1}팀`;t.color=t.color||COLORS[i%COLORS.length][1];t.players=Array.isArray(t.players)?t.players:[];t.players.forEach((p,j)=>{p.id=p.id||rid('p');p.name=p.name||`참가자 ${j+1}`});if(!Array.isArray(t.rounds)){const oldKills={};t.players.forEach(p=>oldKills[p.id]=Number(p.kills||0));t.rounds=[{id:rid('r'),kills:oldKills,chicken:Number(t.chicken||0),bonus:Number(t.bonus||0)}]};if(!t.rounds.length)t.rounds=[makeRound(t.players)];t.rounds.forEach(r=>{r.id=r.id||rid('r');r.kills=r.kills||{};t.players.forEach(p=>{r.kills[p.id]=Number(r.kills[p.id]||0)});r.chicken=Number(r.chicken||0);r.bonus=Number(r.bonus||0);r.locked=!!r.locked})});if(!state.settings.defaultRoundsV6){state.teams.forEach(t=>{while(t.rounds.length<DEFAULT_ROUNDS)t.rounds.push(makeRound(t.players))});state.settings.defaultRoundsV6=true}}
function playerKills(t,p){return t.rounds.reduce((a,r)=>a+Number(r.kills?.[p.id]||0),0)}
function killSum(t){return t.players.reduce((a,p)=>a+playerKills(t,p),0)}
function chickenSum(t){return t.rounds.reduce((a,r)=>a+Number(r.chicken||0),0)}
function bonusSum(t){return t.rounds.reduce((a,r)=>a+Number(r.bonus||0),0)}
function roundScore(t,r){return t.players.reduce((a,p)=>a+Number(r.kills?.[p.id]||0),0)*Number(state.settings.killPoint||0)+Number(r.chicken||0)*Number(state.settings.chickenPoint||0)+Number(r.bonus||0)}
function teamScore(t){return t.rounds.reduce((a,r)=>a+roundScore(t,r),0)}
function teamCard(t,rank){return `<article class="team-card ${rank===1?'rank1':''}" style="--team:${t.color}"><div class="team-head"><div class="team-name"><span class="rank-badge">${rank}</span>${esc(t.name)}</div><div class="team-total"><small>합계</small>${teamScore(t)}</div></div>${t.players.map(p=>`<div class="player-row"><span>${esc(p.name)}</span><span class="player-score">${playerKills(t,p)}</span></div>`).join('')}<div class="team-foot"><span>${t.rounds.length}R</span><span>킬 ${killSum(t)}</span><span>🍗 ${chickenSum(t)}</span>${bonusSum(t)?`<span>보너스 ${bonusSum(t)>0?'+':''}${bonusSum(t)}</span>`:''}</div></article>`}
function ranked(){return [...state.teams].sort((a,b)=>teamScore(b)-teamScore(a)).map((t,i)=>({t,rank:i+1}))}
function renderBoard(){const ranks=new Map(ranked().map(x=>[x.t.id,x.rank]));$('boardTitle').textContent=state.settings.title;$('teamGrid').innerHTML=state.teams.map(t=>teamCard(t,ranks.get(t.id))).join('')}
function colorOptions(v){return COLORS.map(([n,c])=>`<option value="${c}" ${c===v?'selected':''}>${n}</option>`).join('')}
function scoreControl(ti,ri,pid,val,locked=false){return `<div class="score-input"><button data-act="rminus" data-ti="${ti}" data-ri="${ri}" data-pid="${pid}" class="btn-light" ${locked?'disabled':''}>−</button><input data-act="rkill" data-ti="${ti}" data-ri="${ri}" data-pid="${pid}" type="number" min="0" value="${val}" ${locked?'disabled':''}><button data-act="rplus" data-ti="${ti}" data-ri="${ri}" data-pid="${pid}" class="btn-primary" ${locked?'disabled':''}>+</button></div>`}
function globalRoundCount(){return Math.max(1,...state.teams.map(t=>t.rounds.length))}
function ensureGlobalRounds(){const n=globalRoundCount();state.teams.forEach(t=>{while(t.rounds.length<n)t.rounds.push(makeRound(t.players))})}
function masterSheet(){ensureGlobalRounds();const n=globalRoundCount();return `<div class="sheet-admin">${state.teams.map((t,ti)=>`<div class="team-mini"><b>${ti+1}</b><input data-act="teamName" data-ti="${ti}" value="${esc(t.name)}"><select data-act="teamColor" data-ti="${ti}">${colorOptions(t.color)}</select><button data-act="addPlayer" data-ti="${ti}" class="btn-success">+ 참가자</button><button data-act="delPlayerLast" data-ti="${ti}" class="btn-danger">− 참가자</button><button data-act="deleteTeam" data-ti="${ti}" class="btn-danger">팀 삭제</button></div>`).join('')}</div><div class="master-sheet-wrap"><table class="master-sheet"><thead><tr><th class="lock-col" rowspan="3">잠금</th><th class="round-col" rowspan="3">ROUND</th>${state.teams.map((t,ti)=>`<th class="team-group team-sep" colspan="${t.players.length+3}" style="background:${t.color}22">${esc(t.name)}</th>`).join('')}</tr><tr>${state.teams.map((t,ti)=>`${t.players.map((p,pi)=>`<th class="player-head ${pi===0?'team-sep':''}"><input class="player-name-edit" data-act="playerName" data-ti="${ti}" data-pi="${pi}" value="${esc(p.name)}"></th>`).join('')}<th class="special-head">🍗</th><th class="special-head">보너스</th><th class="sum-head">합계</th>`).join('')}</tr><tr>${state.teams.map((t,ti)=>`${t.players.map((p,pi)=>`<th class="player-head ${pi===0?'team-sep':''}">킬</th>`).join('')}<th style="background:#dcfce7">치킨</th><th style="background:#fee2e2">±</th><th style="background:#dbeafe">점수</th>`).join('')}</tr></thead><tbody>${Array.from({length:n},(_,ri)=>{const locked=state.teams.every(t=>t.rounds[ri]?.locked);return `<tr class="${locked?'locked-row':''}"><td class="lock-col"><input class="round-lock" data-act="globalLock" data-ri="${ri}" type="checkbox" ${locked?'checked':''}></td><td class="round-col">${ri+1}R</td>${state.teams.map((t,ti)=>{const r=t.rounds[ri];return `${t.players.map((p,pi)=>`<td class="${pi===0?'team-sep':''}">${scoreControl(ti,ri,p.id,Number(r.kills?.[p.id]||0),r.locked)}</td>`).join('')}<td><input class="special-input" data-act="rchicken" data-ti="${ti}" data-ri="${ri}" type="number" min="0" value="${r.chicken}" ${r.locked?'disabled':''}></td><td><input class="special-input" data-act="rbonus" data-ti="${ti}" data-ri="${ri}" type="number" value="${r.bonus}" ${r.locked?'disabled':''}></td><td class="team-sum-cell"><b>${roundScore(t,r)}</b></td>`}).join('')}</tr>`}).join('')}<tr class="sum-row"><td class="lock-col">🔒</td><td class="round-col">누적</td>${state.teams.map((t,ti)=>`${t.players.map((p,pi)=>`<td class="${pi===0?'team-sep':''}">${playerKills(t,p)}</td>`).join('')}<td>${chickenSum(t)}</td><td>${bonusSum(t)}</td><td class="team-sum-cell">${teamScore(t)}</td>`).join('')}</tr></tbody></table></div><div class="master-actions"><button data-act="globalAddRound" class="btn-primary">+ 라운드 추가</button><button data-act="globalDelRound" class="btn-light">마지막 라운드 삭제</button><button data-act="globalReset" class="btn-danger">전체 기록 초기화</button></div>`}
function renderEditors(){
$('titleInput').value=state.settings.title;$('killPoint').value=state.settings.killPoint;$('chickenPoint').value=state.settings.chickenPoint;
$('teamEditors').innerHTML=masterSheet();
$('teamPopupButtons').innerHTML=`<button id="openAll2" class="btn-dark">전체 현황 새 창</button>`+state.teams.map((t,i)=>`<button data-popup-team="${i}" class="btn-light">${esc(t.name)} 새 창</button>`).join('');$('openAll2').onclick=()=>openPopup('all');document.querySelectorAll('[data-popup-team]').forEach(b=>b.onclick=()=>openPopup(b.dataset.popupTeam));bindEditorActions()}
function render(){normalize();renderBoard();renderEditors();renderPopup()}
function path(s=''){return ref(db,`pubgKillRooms/${roomId}${s?'/'+s:''}`)}
async function save(){if(localMode||!roomId){localStorage.setItem('pubg-kill-local',JSON.stringify(state));render();return}await set(path(),state)}
function addPlayerToTeam(t){const p=makePlayer(`참가자 ${t.players.length+1}`);t.players.push(p);t.rounds.forEach(r=>r.kills[p.id]=0)}
function removePlayer(t,pi){const p=t.players[pi];if(!p)return;t.players.splice(pi,1);t.rounds.forEach(r=>delete r.kills[p.id])}
function bindEditorActions(){document.querySelectorAll('[data-act]').forEach(el=>{const a=el.dataset.act,ti=+el.dataset.ti,pi=+el.dataset.pi,ri=+el.dataset.ri,pid=el.dataset.pid;if(a==='globalLock'){el.onchange=async()=>{state.teams.forEach(t=>{if(t.rounds[ri])t.rounds[ri].locked=el.checked});await save()};return;}if(['teamName','teamColor','playerName','rkill','rchicken','rbonus'].includes(a)){el.onchange=async()=>{const t=state.teams[ti];if(a==='teamName')t.name=el.value.trim()||`${ti+1}팀`;if(a==='teamColor')t.color=el.value;if(a==='playerName')t.players[pi].name=el.value.trim()||`참가자 ${pi+1}`;if(a==='rkill'&&!t.rounds[ri].locked)t.rounds[ri].kills[pid]=Math.max(0,Number(el.value||0));if(a==='rchicken'&&!t.rounds[ri].locked)t.rounds[ri].chicken=Math.max(0,Number(el.value||0));if(a==='rbonus'&&!t.rounds[ri].locked)t.rounds[ri].bonus=Number(el.value||0);await save()};return;}el.onclick=async()=>{if(a==='globalAddRound'){state.teams.forEach(t=>t.rounds.push(makeRound(t.players)));await save();return}if(a==='globalDelRound'){if(globalRoundCount()<=1)return alert('최소 1개 라운드는 남겨야 합니다.');if(confirm('마지막 라운드를 삭제할까요?'))state.teams.forEach(t=>t.rounds.pop());await save();return}if(a==='globalReset'){if(confirm('전체 라운드 기록을 초기화할까요?'))state.teams.forEach(t=>t.rounds=makeRounds(t.players));await save();return}const t=state.teams[ti];if(a==='rminus'&&!t.rounds[ri].locked)t.rounds[ri].kills[pid]=Math.max(0,Number(t.rounds[ri].kills[pid]||0)-1);if(a==='rplus'&&!t.rounds[ri].locked)t.rounds[ri].kills[pid]=Number(t.rounds[ri].kills[pid]||0)+1;if(a==='addPlayer')addPlayerToTeam(t);if(a==='delPlayerLast'){if(t.players.length<=1)return alert('최소 1명은 남겨야 합니다.');removePlayer(t,t.players.length-1)}if(a==='deleteTeam'){if(state.teams.length<=1)return alert('최소 1개 팀은 남겨야 합니다.');if(!confirm(`${t.name}을(를) 삭제할까요?\n해당 팀의 모든 라운드 기록도 함께 삭제됩니다.`))return;state.teams.splice(ti,1)}await save()}})}
$('titleInput').onchange=async e=>{state.settings.title=e.target.value.trim()||'배그 킬내기';await save()};$('killPoint').onchange=async e=>{state.settings.killPoint=Number(e.target.value||0);await save()};$('chickenPoint').onchange=async e=>{state.settings.chickenPoint=Number(e.target.value||0);await save()};$('addTeam').onclick=async()=>{state.teams.push(makeTeam(state.teams.length));await save()};
function popupUrl(view){const u=new URL(location.href);u.searchParams.set('view',view);if(roomId)u.searchParams.set('room',roomId);return u.toString()}function openPopup(which){if(!roomId)return alert('실시간 방송용 새 창은 먼저 방을 만들어 주세요.');window.open(popupUrl(which==='all'?'all':`team-${which}`),`pubgKill_${which}`,`width=700,height=650,resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no,location=no`)}
function renderPopup(){if(!document.body.classList.contains('broadcast-view')||!state)return;const view=new URLSearchParams(location.search).get('view');const ranks=new Map(ranked().map(x=>[x.t.id,x.rank]));let teams=state.teams;if(view?.startsWith('team-')){const i=Number(view.slice(5));teams=state.teams[i]?[state.teams[i]]:[];$('popupBoard').className='popup-board popup-one'}else $('popupBoard').className='popup-board popup-all';$('popupTeamGrid').innerHTML=teams.map(t=>teamCard(t,ranks.get(t.id))).join('')}
function setStatus(text,on=false){$('roomStatus').textContent=text;$('roomStatus').classList.toggle('connected',on)}function code(){return Math.random().toString(36).slice(2,7).toUpperCase()}
async function presence(){if(!roomId)return;presenceRef=path(`presence/${uid}`);await set(presenceRef,{joinedAt:Date.now()});onDisconnect(presenceRef).remove();presenceUnsub?.();presenceUnsub=onValue(path('presence'),s=>$('participantCount').textContent=Object.keys(s.val()||{}).length)}
function listen(){unsub?.();unsub=onValue(path(),s=>{const v=s.val();if(v){const {presence,...clean}=v;state=clean;setStatus(`방 ${roomId} 연결됨`,true);render()}else setStatus('방을 찾을 수 없음')})}
$('newRoomBtn').onclick=async()=>{localMode=false;roomId=$('roomId').value.trim()||code();$('roomId').value=roomId;normalize();await set(path(),state);listen();await presence()};$('joinRoomBtn').onclick=async()=>{roomId=$('roomId').value.trim();if(!roomId)return alert('방 코드를 입력하세요.');if(!(await get(path())).exists())return setStatus('존재하지 않는 방입니다.');localMode=false;listen();await presence()};$('copyLinkBtn').onclick=async()=>{if(!roomId)return alert('먼저 방을 만들거나 참여하세요.');const u=new URL(location.href);u.searchParams.set('room',roomId);u.searchParams.delete('view');await navigator.clipboard.writeText(u.toString());setStatus('참여 링크를 복사했습니다.',true)};$('resetRoomBtn').onclick=async()=>{if(!confirm('전체 팀의 라운드 기록을 초기화할까요?'))return;state.teams.forEach(t=>t.rounds=makeRounds(t.players));await save()};
$('popupScale').oninput=e=>{const v=Number(e.target.value);document.documentElement.style.setProperty('--popup-scale',v/100);$('popupScaleValue').textContent=v+'%';localStorage.setItem('pubg-popup-scale',v)};

const POPUP_THEME_KEY='pubg-popup-theme';
function applyPopupTheme(theme){
  const next=theme==='light'?'light':'dark';
  document.body.classList.toggle('popup-light',next==='light');
  document.body.classList.toggle('popup-dark',next==='dark');
  if($('popupThemeToggle')) $('popupThemeToggle').textContent=next==='dark'?'라이트':'다크';
  localStorage.setItem(POPUP_THEME_KEY,next);
}
$('popupThemeToggle').onclick=()=>applyPopupTheme(document.body.classList.contains('popup-dark')?'light':'dark');

const saved=localStorage.getItem('pubg-kill-local');try{state=saved?JSON.parse(saved):emptyState()}catch{state=emptyState()}normalize();render();const qs=new URLSearchParams(location.search),view=qs.get('view');if(view){document.body.classList.add('broadcast-view');applyPopupTheme(localStorage.getItem(POPUP_THEME_KEY)||'dark');const scale=Number(localStorage.getItem('pubg-popup-scale')||100);$('popupScale').value=scale;$('popupScaleValue').textContent=scale+'%';document.documentElement.style.setProperty('--popup-scale',scale/100)}if(qs.get('room')){roomId=qs.get('room');$('roomId').value=roomId;localMode=false;listen();presence()}else if(view)setStatus('방 정보 없음');
</script></body></html>
